<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagens Menork</title>{% if versao_logo() %}<link rel="icon" href="/logo?v={{ versao_logo() }}">{% endif %}<link rel="stylesheet" href="/static/estilo.css"></head>
<body class="porta">
<canvas id="cartas" aria-hidden="true"></canvas><div class="vinheta" aria-hidden="true"></div>
<form method="post" class="cartao-senha curinga">
  {% if versao_logo() %}<div class="moldura-logo"><img class="logo-grande" src="/logo?v={{ versao_logo() }}" alt=""></div>{% endif %}
  <h1>Menork <small>imagens</small></h1>
  {% if criar %}<p>Primeiro acesso: crie a senha do site.</p>{% else %}<p>Digite a senha para entrar.</p>{% endif %}
  {% if erro %}<div class="alerta">{{ erro }}</div>{% endif %}
  <label>Senha<input type="password" name="senha" autofocus required></label>
  {% if criar %}<label>Repita a senha<input type="password" name="repetir" required></label>{% endif %}
  <button class="b grande">{{ 'Criar senha e entrar' if criar else 'Entrar' }}</button>
</form>
<script src="/static/cartas.js"></script>
</body></html>
